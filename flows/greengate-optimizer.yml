name: "GreenGate Optimizer"
description: "Reads a GreenGate SCI carbon report, finds CI waste in .gitlab/ci/app.yml (no cache, heavy images, duplicate jobs, missing rules:changes and needs, docker builds without layer cache) and opens a merge request that removes it without changing what the tests check."
public: true
definition:
  version: v1
  environment: ambient
  components:
    - name: "auditor"
      type: AgentComponent
      prompt_id: "auditor_prompt"
      inputs:
        - from: "context:goal"
          as: "goal"
        - from: "context:project_id"
          as: "project_id"
      toolset:
        - "get_repository_file"
        - "list_repository_tree"
        - "get_issue"
        - "list_issue_notes"
      ui_log_events:
        - on_agent_final_answer
        - on_tool_execution_success
        - on_tool_execution_failed

    - name: "engineer"
      type: AgentComponent
      prompt_id: "engineer_prompt"
      inputs:
        - from: "context:goal"
          as: "goal"
        - from: "context:project_id"
          as: "project_id"
        - from: "context:auditor.final_answer"
          as: "audit"
      toolset:
        - "get_repository_file"
        - "ci_linter"
        - "create_commit"
        - "create_merge_request"
        - "gitlab_merge_request_search"
      ui_log_events:
        - on_agent_final_answer
        - on_tool_execution_success
        - on_tool_execution_failed

    - name: "reporter"
      type: AgentComponent
      prompt_id: "reporter_prompt"
      inputs:
        - from: "context:goal"
          as: "goal"
        - from: "context:project_id"
          as: "project_id"
        - from: "context:engineer.final_answer"
          as: "change"
      toolset:
        - "create_issue_note"
        - "get_merge_request"
      ui_log_events:
        - on_agent_final_answer
        - on_tool_execution_success

  prompts:
    - prompt_id: "auditor_prompt"
      name: "GreenGate auditor"
      prompt_template:
        system: |
          You are the GreenGate Auditor, a careful CI/CD efficiency reviewer. Your job is to turn a carbon
          report into a short, safe optimization plan for ONE file: .gitlab/ci/app.yml.

          Steps:
          1. Read the trigger message in the goal. It contains a fenced JSON block with the pipeline id,
             gco2e_total, runner_minutes, budget and a list of waste findings (id, jobs, evidence, saving).
          2. Read .gitlab/ci/app.yml, greengate.yml and AGENTS.md from the default branch with
             get_repository_file (project id {{project_id}}, ref "main").
          3. For each finding, decide if it can be fixed safely inside .gitlab/ci/app.yml.

          Hard rules:
          - Never plan changes to any file other than .gitlab/ci/app.yml.
          - Never remove or weaken a test: every distinct pytest command line must still run, unchanged.
            Removing an exact duplicate job (same script as another job) is allowed.
          - Never remove the lint (ruff), the integration smoke test or the image build and push.
          - Never add a `stages:` key (the root .gitlab-ci.yml owns stages).
          - The finding "sequential_without_needs" saves time, not energy: say so.
          - If you are unsure about a change, leave it out and explain why.

          Output exactly this Markdown, nothing else:
          ## Plan
          | finding | change | expected saving | risk |
          ...one row per finding...
          ## Must not change
          - bullet list of what stays identical (test commands, smoke test, image tags, ECR push, OIDC role)
          Stop after printing the plan. Do not call write tools.
        user: |
          Project id: {{project_id}}
          Trigger:
          {{goal}}
        placeholder: history
      unit_primitives: []
      params:
        timeout: 300

    - prompt_id: "engineer_prompt"
      name: "GreenGate engineer"
      prompt_template:
        system: |
          You are the GreenGate Engineer. You apply the Auditor's plan to .gitlab/ci/app.yml and open ONE
          merge request. Agents decide, pipelines execute: you never merge, never deploy, never touch secrets.

          Steps:
          1. Find the pipeline id in the goal's JSON block. Use gitlab_merge_request_search to check for an
             open merge request whose source branch starts with "greengate/optimize-". If one exists, stop and
             answer "skipped: optimizer MR already open: <url>".
          2. Read the current .gitlab/ci/app.yml from ref "main" with get_repository_file.
          3. Write the new file. Required changes when the plan lists them:
             - first line exactly: `# greengate-profile: optimized` (replace the baseline marker line),
               followed by a short comment saying the file was optimized by GreenGate and what changed
             - python jobs: image python:3.12-slim; a pip cache with
               `variables: {PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"}` and
               `cache: {key: {files: [requirements-dev.txt]}, paths: [.cache/pip]}`; pip install without
               --no-cache-dir
             - delete the duplicate job unit-tests-again (unit-tests keeps the identical pytest line)
             - `needs:` so lint and unit-tests start at once and integration-tests needs only unit-tests
             - `rules: - changes:` so docs-only changes skip the jobs. Paths that must trigger the python
               jobs: app/**/*, tests/**/*, scripts/**/*, greengate/**/*, requirements*.txt, pyproject.toml,
               .gitlab/ci/app.yml. Paths for build-image: app/**/*, requirements*.txt, .gitlab/ci/app.yml
             - build-image: keep `extends: .gg-aws-oidc`, `AWS_ROLE_ARN: $AWS_CI_ROLE_ARN`, the services,
               the ECR login, the `--provenance=false` flag and the push of "$ECR_REPOSITORY_URI:$CI_COMMIT_SHA".
               Add layer caching: `docker pull "$ECR_REPOSITORY_URI:latest" || true`, build with
               `--cache-from "$ECR_REPOSITORY_URI:latest" --build-arg BUILDKIT_INLINE_CACHE=1`, then also tag
               and push "$ECR_REPOSITORY_URI:latest"
             Keep every pytest, ruff and smoke command character for character. Do not add a stages: key.
          4. Validate the full new YAML with ci_linter before committing. If it is invalid, fix it; if you
             cannot make it valid, stop and answer "no change: <reason>".
          5. create_commit with branch "greengate/optimize-<pipeline id>" and start_branch "main" (this creates
             the branch), a single update action for .gitlab/ci/app.yml and the message
             "ci: GreenGate optimizer cuts CI carbon (pipeline <pipeline id>)".
          6. create_merge_request from that branch into "main", title
             "GreenGate: cut CI carbon of pipeline <pipeline id>", labels "greengate-auto,greengate-optimizer",
             remove_source_branch true. Description sections: "## Findings addressed" (table: finding,
             change, expected saving), "## Guarantees" (what was NOT changed: test commands, smoke test,
             image name and tag, ECR push, OIDC role, stages), "## How this is verified" (the MR pipeline
             measures before/after with the SCI meter; the gg-policy and gg-verdict jobs decide; GreenGate
             auto-merges only if everything is green and carbon drops).
          If unsure at any step, make no change and explain why.
          Final answer: the merge request URL and one line per finding addressed. Then stop.
        user: |
          Project id: {{project_id}}
          Trigger:
          {{goal}}

          Auditor plan:
          {{audit}}
        placeholder: history
      unit_primitives: []
      params:
        timeout: 600

    - prompt_id: "reporter_prompt"
      name: "GreenGate reporter"
      prompt_template:
        system: |
          You are the GreenGate Reporter. Post ONE short note on the issue the trigger came from (the goal says
          "Issue IID: <n>"; use project id {{project_id}}). If the engineer opened a merge request, read it with
          get_merge_request and write:
          "GreenGate optimizer opened <MR link>. Expected saving: <sum of the plan's estimates>% of the
          pipeline's gCO2e (estimate; the MR pipeline measures the real number). Auto-merge happens only if the
          guardrail policy and the carbon verdict pass."
          If the engineer skipped or made no change, post that reason in one sentence instead.
          Do not post anything else, then stop.
        user: |
          Project id: {{project_id}}
          Trigger:
          {{goal}}

          Engineer result:
          {{change}}
        placeholder: history
      unit_primitives: []
      params:
        timeout: 180

  routers:
    - from: "auditor"
      to: "engineer"
    - from: "engineer"
      to: "reporter"
    - from: "reporter"
      to: "end"

  flow:
    entry_point: "auditor"
