  us-east5: US-MIDA-PJM
  us-central1: US-MIDW-MISO
  europe-north1: FI
  eu-north-1: SE-SE3
  us-west-2: US-NW-BPAT
  us-west1: US-NW-BPAT
  asia-south1: IN-WE
