# GreenGate root pipeline. Real jobs live in .gitlab/ci/*.yml.
# When this repo moves to the hackathon project, its template-validation job stays here too.
include:
  - local: .gitlab/ci/greengate.yml

# One pipeline per change: MR pipelines for MRs, branch pipelines otherwise (no duplicates).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
